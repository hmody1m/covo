name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in $(git ls-files 'server/**.js' 'device/*.js' 'standalone/**.js' 'scripts/*.mjs' 'desktop/src/*.cjs'); do node --check "$f" || exit 1; done
      - run: npm test
      - run: npm run build:web
