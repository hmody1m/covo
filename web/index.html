<!doctype html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Covo</title>
  <meta name="description" content="Your autonomous AI partner — runs things end to end and asks you when it matters." />
  <meta name="theme-color" content="#F9F9F6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Covo" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    // Apply the last theme before first paint (avoids a flash).
    try { var a = JSON.parse(localStorage.getItem('covo:appearance') || '{}'); var th = a.theme === 'system' || !a.theme ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'classic-dark' : 'classic') : a.theme; document.documentElement.dataset.theme = th; if (a.lang === 'ar') { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar'; } } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Covo needs JavaScript.</noscript>
  <script type="module">
    import { boot } from '/js/main.js';
    boot();
  </script>
</body>
</html>
